spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/timerbook
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: true

app:
  reminders:
    reading:
      enabled: true
      cron: "0 0 9 * * *"
      timezone: America/Sao_Paulo
      inactivity-hours: 24
      reminder-interval-minutes: 1440

dev:
  admin:
    seed-enabled: ${DEV_ADMIN_SEED_ENABLED:false}
    email: ${DEV_ADMIN_EMAIL:admin@timerbook.local}
    username: ${DEV_ADMIN_USERNAME:Admin}
    password: ${DEV_ADMIN_PASSWORD:Admin123!}
    reset-password: ${DEV_ADMIN_RESET_PASSWORD:false}

payment:
  webhook-signature:
    enabled: ${PAYMENT_WEBHOOK_SIGNATURE_ENABLED:false}
